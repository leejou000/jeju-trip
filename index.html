<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구실 제주 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 친구끼리 돌려보는 여행 일정표, 가볍고 또렷하게
   IDEA: 제주 현무암 위에 귤색 핀을 꽂은 손지도
   PICTURE: 날짜별 동선이 번호 핀으로 이어지는 섬 지도
   COLOUR and TYPE: 바다 하늘색, 현무암 회색 섬, 귤색 동선 / Black Han Sans + IBM Plex Sans KR
   LAYOUT: 언어와 이름 선택, 날짜 탭, 지도, 시간이 크게 걸린 일정 목록 */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f8,#0e1a22);--ink:light-dark(#14212a,#e8eef1);--mute:light-dark(#5b6b75,#9aabb5);
--sea:light-dark(#cfe3ec,#13303f);--land:light-dark(#3b4043,#2b3136);--land2:light-dark(#555b5f,#3d454b);
--tang:#e8700c;--tang2:light-dark(#fff1e4,#3a2412);--card:light-dark(#fff,#15252f);--line:light-dark(#dde5e9,#24394a);--green:light-dark(#1c7a4f,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 60px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font:400 clamp(32px,6vw,48px)/1.05 "Black Han Sans",sans-serif;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--card);color:var(--ink);font:600 15px "IBM Plex Sans KR",sans-serif;padding:8px 14px;min-height:44px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--tang2);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.me b{margin-right:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tang);border-color:var(--tang);color:#fff;font-weight:600}
button:focus-visible,a:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.status{font-size:13px;color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;border-radius:12px;padding:10px 16px;font:600 16px "IBM Plex Sans KR",sans-serif;background:var(--card);color:var(--ink);min-height:48px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab small{display:block;font-weight:400;font-size:13px;opacity:.75}
.fig{position:relative;background:var(--sea);border-radius:18px;overflow:hidden;aspect-ratio:800/455}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.wx{margin:-4px 2px 12px;font-size:15px}.wx small{color:var(--mute);font-size:13px}
.hint{font-size:13px;color:var(--mute);margin:6px 2px 18px}
ol.list{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.time{font:400 22px/1.2 "Black Han Sans",sans-serif;white-space:nowrap}
.num{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--tang);color:#fff;font:600 13px sans-serif;margin-right:6px;vertical-align:2px}
.num.o{background:transparent;color:var(--tang);border:2px solid var(--tang)}
.name{font-weight:600;font-size:17px}
.name a,.opt a{color:inherit;text-decoration-color:var(--tang);text-underline-offset:3px}
.tag{display:inline-block;font-size:13px;font-weight:400;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--tang2);vertical-align:2px}
.note{color:var(--mute);font-size:15px;margin-top:2px}
.alt{margin-top:6px;font-size:15px;border-left:3px solid var(--green);padding-left:10px}
.alt b{color:var(--green)}
.q{font-size:14px;font-weight:600;color:var(--tang);margin:2px 0 6px}
.opts{display:grid;gap:8px;margin-top:4px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.opt.lead{border-color:var(--tang)}
.ohead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vote{border:1.5px solid var(--tang);background:transparent;color:var(--ink);border-radius:10px;padding:6px 12px;font:600 14px "IBM Plex Sans KR",sans-serif;min-height:40px;cursor:pointer;white-space:nowrap}
.vote[aria-pressed=true]{background:var(--tang);color:#fff}
.who{font-size:14px;color:var(--mute);margin-top:6px}
.who span{display:inline-block;background:var(--tang2);border-radius:999px;padding:1px 9px;margin:2px 3px 2px 0;color:var(--ink)}
.warn{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}.warn span{font-size:13px;border-radius:6px;padding:2px 8px;background:light-dark(#fde8e6,#3b1a17);color:light-dark(#9b2318,#ffb4a8)}.warn span.ok{background:light-dark(#e3f4ea,#163325);color:var(--green)}
.status.bad{color:light-dark(#9b2318,#ffb4a8);font-weight:600}
.car{display:inline-block;font-size:13px;font-weight:600;color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.cnt{font-size:14px;color:var(--mute);margin-left:auto;margin-right:8px}
.board{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.board h2{font:400 22px/1.2 "Black Han Sans",sans-serif;margin:0 0 4px}
.brow{display:flex;gap:8px;margin:10px 0 8px}
.board select,.board textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.board select{flex:1;min-height:44px}.board textarea{width:100%;resize:vertical;display:block}
.board textarea:focus,.board select:focus{outline:3px solid var(--tang);outline-offset:1px}
.send{border:0;background:var(--tang);color:#fff;border-radius:10px;padding:8px 18px;font:600 15px "IBM Plex Sans KR",sans-serif;min-height:44px;cursor:pointer}
.send:disabled{opacity:.5}
.board .status{margin:6px 0 0}
.posts{list-style:none;margin:8px 0 0;padding:0 6px 0 0;max-height:420px;overflow-y:auto}
.posts.in{max-height:none;overflow:visible;padding:0;margin:0}
.arch summary{cursor:pointer;color:var(--mute);font-size:14px;font-weight:600;min-height:32px;padding-top:4px}.posts li{padding:12px 0;border-top:1px solid var(--line)}
.phead{display:flex;align-items:center;flex-wrap:wrap;gap:2px}.pat{margin-left:auto;font-size:13px;color:var(--mute)}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.msgs{max-height:340px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.msg.mine{align-self:flex-end;background:var(--tang2);border-color:transparent}
.mwho{display:block;font-size:13px;font-weight:600;color:var(--mute)}.msg.mine .mwho{display:none}
.msg.pend{opacity:.6}
.mtext{white-space:pre-wrap;overflow-wrap:anywhere}.mt{display:block;font-size:12px;color:var(--mute);text-align:right}
#cform input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
#cform input:focus{outline:3px solid var(--tang);outline-offset:1px}
.foot{margin-top:28px;font-size:13px;color:var(--mute)}
@media(max-width:600px){.stop{grid-template-columns:3.9em minmax(0,1fr)}.time{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.route{stroke-dasharray:6 7;animation:dash 20s linear infinite}@keyframes dash{to{stroke-dashoffset:-260}}}
</style>
</head>

const FLEX=p=>p.startsWith("d2"),SEATS=[7,5];
function flexPlan(s){
  const want=k=>{const v=PICKS[k][s.poll];return v?v.charCodeAt(0)-97:-1},g=lead(s);let best=null;
  const idx=s.opts.map((x,i)=>i);

    RIDERS.forEach(k=>{if(k==="daun"||k==="jh")return;const w=want(k);if(oD!==oJ&&w===oD)R[0].push(k);else if(oD!==oJ&&w===oJ)R[1].push(k);else free.push(k)});
    R.forEach((r,ci)=>{while(r.length>SEATS[ci])free.push(r.pop())});
    free.forEach(k=>{const home=CARS[0].m.includes(k)?0:1,ci=R[home].length<SEATS[home]?home:1-home;R[ci].push(k)});
    const opt=k=>R[0].includes(k)?oD:oJ;
    const sc=[RIDERS.filter(k=>want(k)>=0&&want(k)===opt(k)).length,(want("daun")===oD)+(want("jh")===oJ),+(oD===oJ),+(oD===g)];
    const i=best?sc.findIndex((v,j)=>v!==best.sc[j]):0;
    if(!best||(i>=0&&sc[i]>best.sc[i]))best={sc,ch:o,R};
  }

}

function carPick(s,car){
  if(FLEX(s.poll))return flexPlan(s).ch[CARS.indexOf(car)];
  const ms=car.m.filter(k=>!(AWAY[s.poll]||[]).includes(k));
  const cnt=s.opts.map((o,i)=>ms.filter(k=>PICKS[k][s.poll]===oid(i)).length);
  const top=Math.max(...cnt),g=lead(s);
  if(!top)return g;
  const best=cnt.flatMap((n,i)=>n===top?[i]:[]);
  if(best.length===1)return best[0];
  const dv=PICKS[car.d][s.poll],di=dv?dv.charCodeAt(0)-97:-1;
  return best.includes(di)?di:best.includes(g)?g:best[0];
}

// PEND: 내가 보냈지만 아직 서버 목록에 안 보이는 메시지. 보내자마자 화면에 띄워서 느리게 느껴지지 않게
let CHAT=false,MSGS=[],PEND=[],lastChat=0;
function setChat(cs){
  if(FB)return; // Firebase를 쓰면 채팅은 스트림으로 받는다
  CHAT=Array.isArray(cs);if(!CHAT){drawChatState();return}

}
// Firebase 실시간 데이터베이스: SDK 없이 REST 스트림(EventSource)으로 새 메시지를 바로 받는다
const FBM={};
function startFB(){
  if(!FB||!window.EventSource)return;
  const es=new EventSource(FB+"/chat.json");
  const apply=()=>{CHAT=true;setChatList(Object.values(FBM).sort((a,b)=>(+a.t||0)-(+b.t||0)).slice(-200))};
  es.addEventListener("put",e=>{const d=JSON.parse(e.data),parts=d.path.split("/").filter(Boolean);
    if(!parts.length){for(const k in FBM)delete FBM[k];Object.assign(FBM,d.data||{})}
    else if(parts.length===1){if(d.data===null)delete FBM[parts[0]];else FBM[parts[0]]=d.data}
    apply()});
  es.addEventListener("patch",e=>{const d=JSON.parse(e.data);if(d.path==="/")Object.assign(FBM,d.data||{});apply()});
  es.onerror=()=>{CHAT=false;drawChatState()}; // 브라우저가 알아서 다시 붙고, 붙으면 put이 와서 CHAT이 다시 켜진다
}
function setChatList(cs){
  const next=cs.filter(c=>c&&MEMBERS.some(m=>m[0]===c.who)&&typeof c.text==="string").map(c=>({t:+c.t||0,who:c.who,text:c.text.slice(0,300)}));
  const n0=PEND.length;PEND=PEND.filter(p=>p.sending||!next.some(c=>c.who===p.who&&c.text===p.text&&c.t>=p.t-60000));
  if(JSON.stringify(next)!==JSON.stringify(MSGS)||PEND.length!==n0){if(MSGS.length&&next.length>MSGS.length)lastChat=Date.now();MSGS=next;drawMsgs()}
  drawChatState();
}
function drawChat(){
  const keep=$("ctext")?$("ctext").value:"";

function drawChatState(){const b=$("csend");if(b&&!b.dataset.busy)b.disabled=!CHAT;const m=$("cmsg");if(m&&!CHAT&&!m.textContent)m.textContent=t("cOff");if(m&&CHAT&&m.textContent===t("cOff"))m.textContent=""}
function drawMsgs(){
  const el=$("msgs");if(!el)return;

  if(near||!el.dataset.init){el.scrollTop=el.scrollHeight;el.dataset.init=1}

async function sendChat(){
  const m=$("cmsg"),text=$("ctext").value.trim();

  if(!text||!CHAT)return;

    else{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"chat",who:me,text})});const j=await r.json();ok=!!(j&&j.ok)}
  }catch(e){}

// 날씨: Open-Meteo 무료 예보 (키 없음), 중문 기준. 출발 약 2주 전부터 나온다
let WX=null,wxFail=false;
const WMO=c=>c===0?["☀️","맑음","Clear"]:c<=2?["🌤️","구름 조금","Partly cloudy"]:c===3?["☁️","흐림","Overcast"]:c<=48?["🌫️","안개","Fog"]:c<=57?["🌦️","이슬비","Drizzle"]:c<=67||(c>=80&&c<=82)?["🌧️","비","Rain"]:c<=86?["🌨️","눈","Snow"]:["⛈️","뇌우","Thunderstorms"];
function wxDay(i){
  const d=WX&&WX.daily;if(!d)return null;const k=d.time.indexOf("2026-12-0"+(i+2));if(k<0)return null;
  const w=WMO(d.weather_code[k]);return {e:w[0],txt:lang==="ko"?w[1]:w[2],hi:Math.round(d.temperature_2m_max[k]),lo:Math.round(d.temperature_2m_min[k]),rain:d.precipitation_probability_max[k],wind:Math.round(d.wind_speed_10m_max[k]*10)/10};

    :`<small>${wxFail?(ko?"날씨 예보를 불러오지 못했어요":"Couldn't load the forecast"):(ko?"날씨 예보 불러오는 중":"Loading forecast")}</small>`;
  const c=CLIMATE[day];
  $("wx").innerHTML+=`<br><small>📊 ${ko?"최근 30년 이날 평균 (1996~2025)":"30-year average for this date (1996 to 2025)"}: ${ko?"최고":"high"} ${c[0]}° ${ko?"최저":"low"} ${c[1]}°, ${ko?"비 온 해":"rainy in"} ${c[2]}/30${ko?"년":" years"}, ${ko?"바람 최대 평균":"avg max wind"} ${c[3]}m/s</small>`;
}
// Open-Meteo 과거 자료(ERA5)로 중문 지점의 12월 2~4일을 1996~2025년 30년 평균낸 값. [최고, 최저, 1mm 넘게 비 온 해 수, 최대 풍속]
const CLIMATE={d1:[12.6,7.4,10,5.8],d2:[11.9,7.2,8,6.1],d3:[11.7,6.8,9,6.6]};
async function loadWx(){
  try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=33.25&longitude=126.41&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&wind_speed_unit=ms&timezone=Asia%2FSeoul&start_date=2026-12-02&end_date=2026-12-04");
    const j=await r.json();if(j&&j.daily&&Array.isArray(j.daily.time)){WX=j;wxFail=false}else wxFail=true}catch(e){wxFail=true}
  drawChrome();
}
function render(){drawChrome();drawMe();drawStatus();drawMap();drawList();drawBoard();drawChat()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-l],[data-d],[data-m],[data-v]");if(!b)return;
  if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem("jeju-lang",lang)}catch(x){}render();return}
  if(b.dataset.d){day=b.dataset.d;drawChrome();drawMap();drawList();return}
  if(b.dataset.m){me=b.dataset.m;try{localStorage.setItem("jeju-me",me)}catch(x){}if(msg==="needMe")msg="";drawMe();drawStatus();drawList();return}
  if(b.dataset.v){const [p,o]=b.dataset.v.split(":");vote(p,o)}
});
render();startFB();
// 채팅 칸에 쓰는 중이거나 최근 1분 반 안에 채팅이 오갔으면 2초, 아니면 5초마다 새로 읽는다
(function tick(){const fast=!FB&&((document.activeElement&&document.activeElement.id==="ctext")||Date.now()-lastChat<90000);if(!document.hidden)load();setTimeout(tick,fast?2000:5000)})();
loadWx();setInterval(loadWx,30*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
}
</script>
